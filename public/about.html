    <div class="page"><h1>about</h1></div>

    <section class="block" aria-label="about">
      <div id="about-text" class="prose"></div>
    </section>

    <section class="block" id="contact-section" aria-labelledby="contact-h">
      <div class="block-head"><h2 id="contact-h">contact me</h2></div>
      <form class="contact-form" id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" novalidate>
        <input type="hidden" name="form-name" value="contact">
        <p class="hp" aria-hidden="true"><label>leave this empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
        <div class="field"><label for="c-name">name</label><input id="c-name" name="name" type="text" autocomplete="name" maxlength="100" required aria-describedby="e-name"><p class="err" id="e-name"></p></div>
        <div class="field"><label for="c-email">email</label><input id="c-email" name="email" type="email" autocomplete="email" maxlength="200" required aria-describedby="e-email"><p class="err" id="e-email"></p></div>
        <div class="field"><label for="c-message">message</label><textarea id="c-message" name="message" rows="6" maxlength="5000" required aria-describedby="e-message"></textarea><p class="err" id="e-message"></p></div>
        <div class="form-row">
          <button class="pill solid" type="submit">send message</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </div>
      </form>
      <p id="contact" class="contact" hidden></p>
    </section>
  </main>

  <footer class="foot"><span id="foot-name"></span><span id="foot-year"></span></footer>
