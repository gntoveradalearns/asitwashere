<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>asitwashere</title>
  <meta name="description" content="a portfolio of photographs, drawings and musings by asitwashere.">
  <meta property="og:site_name" content="asitwashere">
  <meta property="og:type" content="website">
  <meta property="og:title" content="asitwashere">
  <meta property="og:description" content="a portfolio of photographs, drawings and musings by asitwashere.">
  <meta property="og:image" content="/previews/site.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en">

  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")==="light"?"light":"dark"}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <a class="skip" href="#main">skip to content</a>
  <header class="bar">
    <nav aria-label="pages">
      <a href="index.html" data-nav="home">home</a>
      <a href="photos.html" data-nav="photos">photographs</a>
      <a href="drawings.html" data-nav="drawings">drawings</a>
      <a href="musings.html" data-nav="musings">musings</a>
      <a href="about.html" data-nav="about">about</a>
    </nav>
    <button type="button" class="switch" id="theme-toggle" role="switch" aria-checked="true" aria-label="dark mode">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      <span class="knob" aria-hidden="true"></span>
    </button>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="site-name">
      <h1 id="site-name">asitwashere</h1>
      <p class="tagline" id="tagline"></p>
    </section>

    <section class="carousel" aria-label="selected work">
      <button type="button" class="car-arrow prev" id="car-prev" aria-label="previous slide">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button type="button" class="car-arrow next" id="car-next" aria-label="next slide">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div class="track" id="track" tabindex="0" aria-label="photographs, drawings and musings"></div>
      <div class="dots" id="dots" role="group" aria-label="choose slide"></div>
    </section>

    <p class="cta"><a class="pill solid" href="about.html#contact-section">get in touch</a></p>
  </main>

  <footer class="foot"><span id="foot-name"></span><span id="foot-year"></span></footer>

  <dialog id="viewer" aria-label="viewer">
    <div class="v-progress" id="v-progress" hidden></div>
    <button type="button" class="v-btn v-close" id="v-close" aria-label="close">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button type="button" class="v-btn v-share" id="v-share" aria-label="share">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>
    </button>
    <button type="button" class="v-btn v-arrow prev" id="v-prev" aria-label="previous">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button type="button" class="v-btn v-arrow next" id="v-next" aria-label="next">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div id="v-body" class="v-body"></div>
  </dialog>

  <script src="js/app.js" defer></script>
</body>
</html>
